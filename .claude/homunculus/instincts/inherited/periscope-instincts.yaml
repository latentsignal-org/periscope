# Periscope Workflow Dependency Update

## Action

Follow the dependency-update workflow:
1. Update the relevant ecosystem manifest.
2. Regenerate the corresponding lockfile or module metadata.
3. Review the generated delta for unrelated drift.
4. Run checks for every affected subsystem.
5. Commit the manifest and generated dependency state together.

## Related

- Companion instinct: `periscope-instinct-dependency-update` (concise action for
  the same workflow; trigger: "When updating dependencies for a package or
