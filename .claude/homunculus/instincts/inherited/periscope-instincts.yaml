# Periscope Workflow Add New Feature Full Stack

## Action

Follow the add-new-feature-full-stack workflow:
1. Design and implement backend DB schema changes (internal/db/schema.sql, db.go, db_test.go)
2. Add/modify backend logic (internal/server/*.go, internal/sync/engine.go, parser changes as needed)
3. Expose new/updated API endpoints (internal/server/*.go)
4. Implement frontend Svelte components and stores (frontend/src/lib/components/{feature}/, stores/{feature}.svelte.ts)
5. Update frontend types (frontend/src/lib/api/types/*.ts)
6. Add/modify frontend tests (frontend/src/lib/stores/{feature}.test.ts, e2e tests if necessary)
7. Update documentation if needed

## Evidence

