# Periscope Workflow Add New Agent Integration

## Action

Follow the add-new-agent-integration workflow:
1. Implement new parser in internal/parser/{agent}.go and test in internal/parser/{agent}_test.go
2. Add discovery logic for agent session files in internal/parser/discovery.go
3. Update internal/parser/types.go and taxonomy.go for agent/tool normalization
4. Wire agent into sync engine (internal/sync/engine.go, engine_integration_test.go)
5. Update config (internal/config/config.go) for agent directories/env vars
6. Update frontend agent color/metadata (frontend/src/lib/utils/agents.ts, agents.test.ts, app.css)
7. Update frontend session list and filters (frontend/src/lib/components/sidebar/SessionItem.svelte, SessionList.svelte, utils/agents.ts)
8. Update documentation (README.md, AGENTS.md, CLAUDE.md as needed)

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: internal/parser/{agent}.go, internal/parser/{agent}_test.go, internal/parser/discovery.go

